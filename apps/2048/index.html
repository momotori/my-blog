<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>2048</title>
<link rel="stylesheet" href="style.css">
<script>
(function () {
  var stored = null;
  try {
    stored = localStorage.getItem("theme");
  } catch (e) {
    /* localStorage unavailable */
  }
  var theme = stored;
  if (theme !== "light" && theme !== "dark") {
    theme = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
  }
  document.documentElement.dataset.theme = theme;
})();
</script>
</head>
<body>
<div class="game-container">
  <header class="game-header">
    <h1 class="game-title">2048</h1>
    <div class="game-header__controls">
      <div class="scoreboard">
        <div class="score-box">
          <span class="score-label">점수</span>
          <span class="score-value" id="score-current">0</span>
        </div>
        <div class="score-box">
          <span class="score-label">최고 점수</span>
          <span class="score-value" id="score-best">0</span>
        </div>
      </div>
      <button type="button" id="new-game-btn" class="btn btn-primary">새로하기</button>
    </div>
  </header>

  <p class="game-instructions">방향키 또는 스와이프로 타일을 밀어보세요</p>

  <div class="board-wrapper">
    <div class="board" id="board">
      <div class="board-grid" id="board-grid"></div>
      <div class="board-tiles" id="board-tiles"></div>
      <div class="overlay" id="overlay" hidden>
        <div class="overlay__content">
          <p class="overlay__message" id="overlay-message"></p>
          <div class="overlay__buttons">
            <button type="button" id="btn-keep-playing" class="btn btn-secondary" hidden>계속하기</button>
            <button type="button" id="btn-restart" class="btn btn-primary">새 게임</button>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
<script src="game.js"></script>
</body>
</html>
