<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Blog</title>
<meta name="description" content="마크다운으로 쓰는 개인 블로그" />
<script src="js/theme-init.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" id="hljs-theme" href="" />
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="index.html">My Blog</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드 전환"></button>
  </div>
</header>

<main class="main--wide">
  <section class="hero">
    <h1 class="hero__title">기록의 신호</h1>
    <p class="hero__subtitle">// 생각을 코드처럼 커밋합니다</p>
  </section>

  <div class="controls">
    <input id="search-input" class="search-input" type="search" placeholder="글 검색..." aria-label="글 검색" />
    <p id="search-status" class="search-status"></p>
    <div id="tag-chips" class="tag-chips"></div>
  </div>

  <ul id="post-list" class="post-list"></ul>
</main>

<footer class="site-footer">&copy; 2026 My Blog · Markdown으로 씁니다</footer>

<noscript>이 사이트는 자바스크립트가 필요합니다.</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script type="module" src="js/list.js"></script>
</body>
</html>
