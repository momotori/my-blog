<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>My Blog</title>
<meta name="description" content="마크다운으로 쓰는 개인 블로그" />
<script src="js/theme-init.js"></script>
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" id="hljs-theme" href="" />
</head>
<body>
<header class="site-header">
  <div class="site-header__inner">
    <a class="site-title" href="index.html">My Blog</a>
    <button id="theme-toggle" class="theme-toggle" type="button" aria-label="다크 모드 전환"></button>
  </div>
</header>

<main>
  <section class="apps-section">
    <h2 class="section-title">미니 웹앱</h2>
    <ul class="app-grid">
      <li class="app-card">
        <a class="app-card__link" href="apps/2048/index.html" aria-label="2048 게임 열기">
          <div class="app-card__preview">
            <iframe src="apps/2048/index.html" loading="lazy" tabindex="-1" title="2048 미리보기"></iframe>
          </div>
          <h3 class="app-card__title">2048</h3>
          <p class="app-card__desc">방향키나 스와이프로 타일을 밀어 숫자를 합치는 클래식 퍼즐 게임. 최고 점수를 갱신해보세요.</p>
        </a>
      </li>
    </ul>
  </section>

  <div class="controls">
    <input id="search-input" class="search-input" type="search" placeholder="글 검색..." aria-label="글 검색" />
    <p id="search-status" class="search-status"></p>
    <div id="tag-chips" class="tag-chips"></div>
  </div>

  <ul id="post-list" class="post-list"></ul>
</main>

<noscript>이 사이트는 자바스크립트가 필요합니다.</noscript>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/11.1.1/marked.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script type="module" src="js/list.js"></script>
</body>
</html>
